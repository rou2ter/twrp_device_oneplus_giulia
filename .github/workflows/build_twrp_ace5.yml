name: Build TWRP for OnePlus Giulia

on:
  workflow_dispatch:   # Chạy thủ công
  push:
    branches:
      - main           # Hoặc nhánh bạn muốn build

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cài đặt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev openjdk-11-jdk python-is-python3

    - name: Thiết lập repo tool
      run: |
        mkdir -p ~/.bin
        echo "$HOME/.bin" >> $GITHUB_PATH
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+rx ~/.bin/repo

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Sync manifest (minimal)
      run: |
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -j$(nproc) --force-sync

    - name: Clone device tree
      run: |
        git clone --depth=1 https://github.com/vitaliylysikov/twrp_device_oneplus_giulia device/oneplus/giulia

    - name: Build TWRP
      run: |
        export CCACHE_DIR=~/.ccache
        export USE_CCACHE=1
        ccache -M 10G
        ccache -z

        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export BUILD_BROKEN_MISSING_REQUIRED_MODULES=true
        lunch twrp_giulia-bp2a-eng
        make clean
        mka recoveryimage -j$(nproc)

        ccache -s

    - name: Upload recovery.img
      uses: actions/upload-artifact@v4
      with:
        name: twrp-recovery
        path: out/target/product/giulia/recovery.img
